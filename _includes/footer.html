<!-- start copy code button -->
<script>
  /* Appends a copy button to every code block. AMP pages skip this by design. */
  if (navigator.clipboard) {
    document.querySelectorAll('figure.highlight, div.highlighter-rouge').forEach(function (block) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-code';
      button.textContent = 'Copy';
      button.setAttribute('aria-label', 'Copy code to clipboard');

      button.addEventListener('click', function () {
        /* With line numbers on, td.code holds the code and the gutter is a sibling
           cell, so reaching for it first keeps the numbers out of the clipboard. */
        var code = block.querySelector('td.code pre') || block.querySelector('pre');

        var label = function (text) {
          button.textContent = text;
          setTimeout(function () { button.textContent = 'Copy'; }, 2000);
        };

        navigator.clipboard.writeText(code.innerText.replace(/\n+$/, '')).then(
          function () { label('Copied'); },
          function () { label('Failed'); }
        );
      });

      block.appendChild(button);
    });
  }
</script>
