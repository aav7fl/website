{% if jekyll.environment == 'production' %}
{% if page.comments %}
<!-- Add Disqus comments. -->
<div id="disqus_thread"></div>
<script type="text/javascript">
  /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */
  var disqus_shortname = 'kyleniewiada'; // required: replace example with your forum shortname
  var disqus_identifier = "{{ site.disqusid }}{{ page.url | replace:'index.html','' }}";

    /* * * DON'T EDIT BELOW THIS LINE * * */
    function loadDisqus() {
        var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
        dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
        (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
    }

    {% if page.comments_lazy %}
    // Pages with `comments_lazy: true` (like the long birds page) only load Disqus
    // once a reader scrolls near the thread or follows a link to #discussion.
    (function() {
        var loaded = false;
        var thread = document.getElementById('disqus_thread');
        var load = function() {
            if (loaded) return;
            loaded = true;
            loadDisqus();
        };
        var wantsDiscussion = function() { return location.hash === '#discussion'; };

        if (!('IntersectionObserver' in window) || wantsDiscussion()) {
            load();
            return;
        }
        var observer = new IntersectionObserver(function(entries) {
            if (entries[entries.length - 1].isIntersecting) { // Latest entry, in case several arrive at once
                observer.disconnect();
                load();
            }
        }, { rootMargin: '600px 0px' });
        observer.observe(thread);
        window.addEventListener('hashchange', function() {
            if (wantsDiscussion()) load();
        });
    })();
    {% else %}
    loadDisqus();
    {% endif %}
</script>
<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a></noscript>
<a href="https://disqus.com" class="dsq-brlink">comments powered by <span class="logo-disqus">Disqus</span></a>
{% endif %}
{% endif %}
